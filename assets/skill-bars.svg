<svg width="480" height="260" viewBox="0 0 480 260" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .label { font-family: 'Segoe UI', sans-serif; font-size: 14px; fill: #e2e2e2; }
    .pct { font-family: 'Segoe UI', sans-serif; font-size: 13px; fill: #a78bfa; }
    .track { fill: #21262d; }
    .bar { fill: #8b5cf6; }

    @keyframes grow1 { from { width: 0; } to { width: 351px; } }
    @keyframes grow2 { from { width: 0; } to { width: 325px; } }
    @keyframes grow3 { from { width: 0; } to { width: 299px; } }
    @keyframes grow4 { from { width: 0; } to { width: 273px; } }
    @keyframes grow5 { from { width: 0; } to { width: 234px; } }

    .b1 { animation: grow1 1.4s ease-out forwards; }
    .b2 { animation: grow2 1.4s ease-out 0.15s forwards; width:0; }
    .b3 { animation: grow3 1.4s ease-out 0.3s forwards; width:0; }
    .b4 { animation: grow4 1.4s ease-out 0.45s forwards; width:0; }
    .b5 { animation: grow5 1.4s ease-out 0.6s forwards; width:0; }
  </style>

  <rect class="bg" width="480" height="260" rx="12"/>

  <text x="20" y="34" class="label">Python</text>
  <text x="440" y="34" class="pct" text-anchor="end">90%</text>
  <rect x="20" y="42" width="390" height="10" rx="5" class="track"/>
  <rect x="20" y="42" height="10" rx="5" class="bar b1"/>

  <text x="20" y="80" class="label">Machine Learning / LLMs</text>
  <text x="440" y="80" class="pct" text-anchor="end">83%</text>
  <rect x="20" y="88" width="390" height="10" rx="5" class="track"/>
  <rect x="20" y="88" height="10" rx="5" class="bar b2"/>

  <text x="20" y="126" class="label">React / JavaScript</text>
  <text x="440" y="126" class="pct" text-anchor="end">77%</text>
  <rect x="20" y="134" width="390" height="10" rx="5" class="track"/>
  <rect x="20" y="134" height="10" rx="5" class="bar b3"/>

  <text x="20" y="172" class="label">FastAPI / Flask</text>
  <text x="440" y="172" class="pct" text-anchor="end">70%</text>
  <rect x="20" y="180" width="390" height="10" rx="5" class="track"/>
  <rect x="20" y="180" height="10" rx="5" class="bar b4"/>

  <text x="20" y="218" class="label">Computer Vision</text>
  <text x="440" y="218" class="pct" text-anchor="end">60%</text>
  <rect x="20" y="226" width="390" height="10" rx="5" class="track"/>
  <rect x="20" y="226" height="10" rx="5" class="bar b5"/>
</svg>
